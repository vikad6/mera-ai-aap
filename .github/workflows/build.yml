name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create full project
        run: |
          mkdir -p app/src/main/java/com/shimla/scooty
          cat > app/src/main/java/com/shimla/scooty/MainActivity.java << 'EOF'
          package com.shimla.scooty;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(new GameView(this));
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Shimla Scooty">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Shimla-Scooty-APK
          path: app/build/outputs/apk/debug/app-debug.apk
